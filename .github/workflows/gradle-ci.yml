name: Java CI with Gradle
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "*" ]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: knock-frontend/package-lock.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Grant execute permission for gradlew
        run: chmod +x knock-backend/gradlew
      - name: Frontend quality gate
        run: cd knock-frontend && npm ci && npm run lint && npm run test && npm run build
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: cd knock-backend && ./gradlew build sonar --info
