spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

storage:
  datasource:
    core:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:

  redis:
    host: localhost
    port: 6379

GOOGLE_CLIENT_ID: test-google-client-id
GOOGLE_CLIENT_SECRET: test-google-client-secret
GOOGLE_REDIRECT_URI: http://localhost:8080/api/v1/auth/social/google/callback
NAVER_MAP_CLIENT_ID: test-naver-client-id
NAVER_MAP_CLIENT_SECRET: test-naver-client-secret
NAVER_SEARCH_CLIENT_ID: test-naver-search-client-id
NAVER_SEARCH_CLIENT_SECRET: test-naver-search-client-secret
